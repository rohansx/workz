[package]
name = "workz"
version = "0.11.0"
edition = "2021"
description = "The environment engine for agent worktrees — zero-config dep sync and port/DB/compose isolation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rohansx/workz"
keywords = ["git", "worktree", "cli", "ai", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
skim = "0.10"
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
